services:
  # Zookeeper
  zookeeper:
    image: confluentinc/cp-zookeeper:7.3.0
    networks:
      - mlops
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"

  # Kafka
  kafka:
    image: confluentinc/cp-kafka:7.3.0
    depends_on:
      - zookeeper
    networks:
      - mlops
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    healthcheck:
      test: ["CMD", "kafka-topics", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 5s
      timeout: 10s
      retries: 10


  kafka-setup:
    image: confluentinc/cp-kafka:7.3.0
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - mlops
    restart: on-failure
    entrypoint: ["/bin/bash", "-c"]
    command: |
      "
      echo 'Waiting for Kafka...'
      while ! kafka-topics --bootstrap-server kafka:29092 --list; do
        sleep 1
      done
      echo 'Creating topic transactions...'
      kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic transactions --partitions 3 --replication-factor 1 --config retention.ms=604800000
      echo 'Topics created:'
      kafka-topics --bootstrap-server kafka:29092 --list
      "

  # ClickHouse
  clickhouse:
    image: clickhouse/clickhouse-server:24.3
    networks:
      - mlops
    ports:
      - "8123:8123"    # HTTP API
      - "9000:9000"    # Native TCP
    environment:
      CLICKHOUSE_DB: fraud_db
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: ""
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    volumes:
      - ./init-db:/docker-entrypoint-initdb.d
      - clickhouse_data:/var/lib/clickhouse

  # Producer
  producer:
    build: ./producer
    networks:
      - mlops
    environment:
      KAFKA_BROKERS: "kafka:29092"
      KAFKA_TOPIC: "transactions"
      CSV_PATH: "/app/data/train_sample.csv"
    volumes:
      - ./producer/data:/app/data
    depends_on:
      kafka:
        condition: service_healthy
      kafka-setup:
        condition: service_completed_successfully

networks:
  mlops:
    driver: bridge

volumes:
  clickhouse_data: